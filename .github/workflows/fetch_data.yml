name: Fetch Crypto Data on Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Runs every hour

jobs:
  fetch_data:
    name: Fetch and Pre-process Crypto & Fear/Greed Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      # ... (Steps for setting up Python, Poetry, DVC) ...

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Setup DVC
        uses: iterative/setup-dvc@v1 # Or v2
        with:
          version: "3.45.0"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.2"
          cache: poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: DVC Authenticate
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}

      # --- ADD THIS MANUAL CLEANUP STEP ---
      - name: Clean reports directory
        run: rm -rf reports/
      # ------------------------------------

      - name: DVC Checkout (Clean workspace) # This should now pass cleanly for reports/
        run: dvc checkout

      - name: DVC Pull data and cache # This should also pass now
        run: dvc pull

      # --- Run DVC Pipeline (which includes your test_data stage) ---
      - name: Run DVC Pipeline
        run: dvc repro
      # ------------------------------------------------------------

      # ... (Steps for DVC push, Git commit, and Git push) ...

      - name: DVC Push data cache
        run: dvc push

      - name: Commit dvc.lock changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add dvc.lock
          git diff-index --quiet HEAD || git commit -m "Updated dvc.lock by GitHub Actions"

      - name: Push Git changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
