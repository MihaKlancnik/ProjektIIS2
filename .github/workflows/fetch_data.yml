name: Fetch Crypto Data on Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Runs every hour

jobs:
  fetch_data:
    name: Fetch and Pre-process Crypto & Fear/Greed Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Setup DVC
        uses: iterative/setup-dvc@v1
        with:
          version: "3.45.0"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.2"
          cache: poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: DVC pull data
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull

      - name: Run fetch crypto script
        run: |
          poetry run python src/data/fetch_save.py
          dvc add data/raw/crypto_prices.json data/preprocessed/price/bitcoin.csv data/preprocessed/price/ethereum.csv data/preprocessed/price/solana.csv

      - name: Run fetch fear and greed script
        run: |
          poetry run python src/data/fetch_fear_greed.py
          dvc add data/preprocessed/fear_greed/fear_greed_index.csv

      - name: Commit pipeline changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add dvc.lock data/raw/crypto_prices.json.dvc data/preprocessed/price/bitcoin.csv.dvc data/preprocessed/price/ethereum.csv.dvc data/preprocessed/price/solana.csv.dvc data/preprocessed/fear_greed/fear_greed_index.csv.dvc
          git commit -m "Updated data and dvc.lock on `date` with GitHub Actions" || true
          dvc push

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
