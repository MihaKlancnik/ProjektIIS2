name: Fetch Crypto Data on Schedule


jobs:
  fetch_data:
    name: Fetch and Pre-process Crypto & Fear/Greed Data
    runs-on: ubuntu-latest

    env: # Set environment variables for the entire job
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USER }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
      # These are used by your Python script to construct the MLFLOW_TRACKING_URI
      DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
      DAGSHUB_REPO: ProjektIIS2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install Poetry
        run: |
          pipx install poetry

      - name: Setup DVC
        uses: iterative/setup-dvc@v1
        with:
          version: "3.45.0"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.2"
          cache: poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: DVC pull data
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}
          dvc pull

      - name: List preprocessed data
        run: ls -R data/preprocessed/

      - name: Debug Checkpoints and Data
        run: |
          ls -R gx/checkpoints/
          ls -R data/preprocessed/

      - name: Pull existing predictions data
        run: |
          dvc pull predictions

      - name: Run DVC pipeline
        run: |
          dvc repro
          dvc push
          git add dvc.lock
          git commit -m "Update dvc.lock on `date` with GitHub Actions" || true

      - name: Push updated predictions
        run: |
          dvc push predictions

      - name: Commit pipeline changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          dvc commit -f
          git add dvc.lock dvc.yaml
          git commit -m "Updated data and dvc.lock on `date` with GitHub Actions" || true
          dvc push

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
