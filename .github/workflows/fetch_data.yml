name: Fetch Crypto Data on Schedule

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *" # Runs every hour

jobs:
  fetch_data:
    name: Fetch and Pre-process Crypto & Fear/Greed Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Install Poetry
        run: |
          pipx install poetry # Or use pip install poetry depending on preference

      - name: Setup DVC
        uses: iterative/setup-dvc@v1 # Or v2 if available and preferred
        with:
          version: "3.45.0"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11.2"
          cache: poetry

      - name: Install dependencies
        run: |
          poetry install --no-interaction --no-root

      - name: DVC Authenticate # Renamed for clarity
        run: |
          dvc remote modify origin --local access_key_id ${{ secrets.DAGSHUB_ACCESS_KEY_ID }}
          dvc remote modify origin --local secret_access_key ${{ secrets.DAGSHUB_SECRET_ACCESS_KEY }}

      # --- ADD THIS STEP TO CLEAN WORKSPACE ---
      - name: DVC Checkout (Clean workspace)
        run: dvc checkout
      # ---------------------------------------

      - name: DVC Pull data and cache # This should now work without report conflicts
        run: dvc pull

      # --- REPLACE MANUAL SCRIPT CALLS WITH DVC REPRO ---
      - name: Run DVC Pipeline (Fetch, Test, etc.)
        # This single command runs all stages defined in your dvc.yaml
        run: dvc repro
      # -----------------------------------------------

      # --- MOVE DVC PUSH HERE ---
      - name: DVC Push data cache
        # Push any data/cache changes made by dvc repro
        run: dvc push
      # ------------------------

      # --- MOVE GIT COMMIT AND PUSH HERE ---
      - name: Commit dvc.lock changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add dvc.lock # Add dvc.lock if it was updated by dvc repro
          # Commit only if there are changes (handles cases where dvc.lock doesn't change)
          git diff-index --quiet HEAD || git commit -m "Updated dvc.lock by GitHub Actions"

      - name: Push Git changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          # You might want to specify the branch, e.g., branch: main
      # -------------------------------------
