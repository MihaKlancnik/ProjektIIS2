name: Build and Deploy Docker Container

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Stop and remove existing container
            docker stop crypto-predictor-staging || true
            docker rm crypto-predictor-staging || true

            # Run new container
            docker run -d \
              --name crypto-predictor-staging \
              --restart unless-stopped \
              -p 5000:5000 \
              -e FLASK_ENV=staging \
              -e MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USER }} \
              -e MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }} \
              -e DAGSHUB_USER=${{ secrets.DAGSHUB_USER }} \
              -e DAGSHUB_REPO=ProjektIIS2 \
              -v /opt/crypto-predictor/data:/app/data \
              -v /opt/crypto-predictor/models:/app/models \
              -v /opt/crypto-predictor/predictions:/app/predictions \
              -v /opt/crypto-predictor/reports:/app/reports \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Clean up old images
            docker image prune -f

  deploy-to-production:
    needs: [build-and-push, deploy-to-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            # Create necessary directories
            mkdir -p /opt/crypto-predictor/{data,models,predictions,reports}

            # Pull latest image
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Use docker-compose for production deployment
            cd /opt/crypto-predictor

            # Download docker-compose.yml if not exists
            if [ ! -f docker-compose.yml ]; then
              curl -o docker-compose.yml https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml
              curl -o nginx.conf https://raw.githubusercontent.com/${{ github.repository }}/main/nginx.conf
            fi

            # Set environment variables
            export MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USER }}
            export MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}
            export DAGSHUB_USER=${{ secrets.DAGSHUB_USER }}
            export DAGSHUB_REPO=ProjektIIS2

            # Deploy with docker-compose
            docker-compose --profile production down || true
            docker-compose --profile production pull
            docker-compose --profile production up -d

            # Clean up old images
            docker image prune -f

  security-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      security-events: write

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
