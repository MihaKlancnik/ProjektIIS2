schema: '2.0'
stages:
  fetch_and_preprocess:
    cmd: "poetry run python src/data/fetch_save.py git commit -am \"Updated crypto
      data on `date` with DVC pipeline and GitHub workflows\" 2>$null git push 2>$null
      dvc push 2>$null\n"
    deps:
    - path: src/data/fetch_save.py
      hash: md5
      md5: 0cd8ab9acada3c74f25ef4a89a091d45
      size: 1623
    params:
      params.yaml:
        fetch.url: 
          https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd
    outs:
    - path: data/preprocessed/price
      hash: md5
      md5: 4b3888feaa89ae082fb635eec79607ca.dir
      size: 9000
      nfiles: 3
    - path: data/raw/crypto_prices.json
      hash: md5
      md5: b41ce91c2a20c1692afd25d93c99076c
      size: 150
  fetch_crypto_data:
