fetch:
  url: "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd"
  fear_greed_url: "https://api.alternative.me/fng/?limit=10&format=csv&date_format=world"

preprocess:
  cryptocurrencies:
    - bitcoin
    - ethereum
    - solana
  output_dir: "data/preprocessed/price"
  raw_dir: "data/raw"
  raw_filename: "crypto_prices.json"
  fear_greed_output_dir: "data/preprocessed/fear_greed"
  fear_greed_raw_filename: "fear_greed_raw.csv"
  fear_greed_output_filename: "fear_greed_index.csv"
